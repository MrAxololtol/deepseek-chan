# Mochi configuration
# Copy to:  <user config dir>/mochi/config.toml
# or run:   mochi config
#
# Every value here is optional; anything omitted uses the built-in default.

scale = 0.9
always_on_top = true
click_through = true
start_position = "bottom-right"   # bottom-right | bottom-left | top-right | top-left
remember_position = true
hide_on_fullscreen = true
follow_desktops = true            # stay visible on every workspace (bspwm sticky)
theme_follow = true               # recolour her blue parts to the desktop accent
theme_accent_file = "~/.config/polybar/colors.ini"   # where colorChange writes it
# theme_color = "#b03060"         # pin an accent instead of following the theme
# theme_base_hue = 227.0          # hue of the sprite's base blue (advanced)
outfit = "hoodie"                 # hoodie | hoodie_up
skin = "whale"                    # whale | neko  (chatbox: /neko, /whale)
# sprite_pack = "~/my-mochi-skins"
# neko_pack = "~/my-mochi-neko"   # override the bundled neko sprite pack
summon_hotkey = "super + p"
ask_hotkey = "super + alt + button1"   # Super+Alt click her to ask opencode
# How the ask box sends your message. "{prompt}" is replaced with what you
# typed; empty = auto-detect a terminal and run `opencode run`.
# ask_command = ["kitty", "--hold", "-e", "opencode", "run", "{prompt}"]

[timing]
sleep_after = 120.0               # seconds idle before she lies down
hard_thinking_after = 600.0       # "thinking (longer)" after 10 minutes
finished_bubble_for = 5.0
stale_after = 300.0
blink_min = 2.0
blink_max = 6.0
flip_min = 25.0                   # idle hair-flip interval
flip_max = 45.0
coffee_after = 8.0                # she pulls out coffee after this long working
fps = 12

[physics]
enabled = true                    # scruff-grab dangle and fling
stiffness = 90.0                  # spring pull back to centre
damping = 7.0                     # how quickly the swinging settles
lag = 0.05                        # how far she trails a fast drag
max_offset = 48.0                 # pixels of horizontal swing
max_swing_deg = 22.0              # body tilt at full swing
settle = 1.2                      # seconds the "held" pose lingers after release

# Re-theme the whole character from here. These feed the {{token}} placeholders
# baked into every SVG asset.
[palette]
hair = "#4D6BFE"
hair_shadow = "#2B3FB0"
hair_shine = "#8FA8FF"
skin = "#FFE6D5"
skin_shadow = "#F5C9B0"
iris = "#2FD4E8"
pupil = "#0B1B3A"
hoodie = "#17224A"
hoodie_trim = "#4DE1FF"
skirt = "#101830"
thigh = "#0C1226"
outline = "#1A2140"
bubble_bg = "rgba(10,16,32,0.85)"
bubble_border = "#4D6BFE"
bubble_text = "#CDE8FF"
zzz = "#9FB4FF"

# Things she can say. She cycles through each list in order. A [quips] table
# merges with the defaults, so you only need to list the categories you change.
[quips]
finished = ["Finished thinking", "All done!", "Nailed it~"]
thinking = ["Thinking...", "Hmm...", "Processing..."]
thinking_hard = ["Still thinking...", "This is a big one..."]
error = ["Oh no...", "That broke!", "!?"]
pat = ["ehehe~", "that's the spot", "pat pat~", "mmm~", "okay, one more"]
flick = ["ah! my nose!", "boop me again, I dare you", "eep! not the nose!", "hey! that tickles!", "did you just flick me?!"]
held = ["wah! I can't reach the floor!", "h-hey, a little warning please!", "I was comfortable, you know", "is this how you treat all your pets?", "put me back, I'm warning you"]
surprised = ["!?", "w-what!", "huh!?"]
wake = ["mmh... five more minutes", "I'm up, I'm up!", "*yawn*"]
working = []
# The shipped defaults above are deliberately tame. If you want a flirtier pet,
# opt in by uncommenting and editing these (your call, your desktop):
# pat   = ["ehehe~", "mmm~ don't stop", "pat pat~", "okay, one more", "more, please"]
# held  = ["wah! I can't reach the floor!", "h-hey, easy with the hood!", "put me back right now", "is this how you treat all your pets?"]
