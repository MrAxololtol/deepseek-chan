[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi"
version = "0.1.0"
description = "An interactive Mochi anime-girl desktop pet overlay for the opencode TUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MrAxololtol" }]
keywords = ["opencode", "deepseek", "desktop-pet", "anime", "overlay", "pyqt6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PyQt6>=6.5",
  "platformdirs>=3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/MrAxololtol/mochi"
Issues = "https://github.com/MrAxololtol/mochi/issues"

[project.scripts]
mochi = "mochi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mochi = ["assets/*.svg", "assets/adult/*.png", "assets/neko/*.png", "plugin/*.js", "config.example.toml", "themes/*.toml"]
